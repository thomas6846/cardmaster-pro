name: Ingest shop buyback tweets

# Auto-runs the Twitter -> Claude Vision OCR -> CompetitorPrice pipeline.
# Schedule: hourly. since_id means each run only fetches NEW tweets, so most
# hours find nothing and cost almost nothing (X reads only, no OCR). OCR fires
# only when a shop posts a fresh price-list image — so new posts are picked up
# within ~1 hour without re-processing old ones.
# (GitHub throttles scheduled runs to roughly :00 each hour, sometimes later.)
#
# SETUP (one-time): add a repo secret named CRON_SECRET matching the value
# set in Railway. Settings -> Secrets and variables -> Actions -> New secret.

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {} # allows manual "Run workflow" button

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ingest endpoint
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://cardmaster-pro-production.up.railway.app/api/cron/ingest-twitter?maxTweets=3&maxImages=2" \
            --max-time 290 | head -c 2000
